schema_version: 1

scenario:
  name: ku_leo_ofdm_baseline
  status: team_integration_v1
  represents_actual_starlink_waveform: false
  description: >-
    Team integration and channel-research baseline. These values are explicit
    study assumptions, not a claim about the proprietary Starlink waveform.

radio:
  link_direction: downlink
  carrier_frequency_hz: 11700000000.0

ofdm:
  fft_size: 256
  subcarrier_spacing_hz: 120000.0
  active_subcarrier_count: 223
  cyclic_prefix_samples: 0
  modulation: QPSK
  dc_subcarrier_null: true
  active_subcarrier_layout: minyoung_fftshift_guard16_dc_null
  pilot:
    placement: frequency_comb
    spacing_active_subcarriers: 16
    fftshift_bin_indices:
      - 16
      - 32
      - 48
      - 64
      - 80
      - 96
      - 112
      - 129
      - 145
      - 161
      - 177
      - 193
      - 209
      - 225
      - 239
  waveform_normalization:
    data_symbol_average_energy: 1.0
    pilot_symbol_magnitude: 1.0
    ifft_convention: numpy_backward
    time_domain_scale: nfft_over_sqrt_active_subcarriers
    channel_input_average_power: 1.0

channel_grid:
  time_axis: ofdm_symbol
  symbol_time_reference: fft_window_center
  subcarrier_index_convention: signed_fft
  waveform_bin_order: fftshifted

channel_state:
  geometry_source_step_s: 1.0
  update_interval_s: 0.001
  resampling_method: cubic_hermite
  validate_against_direct_sgp4: true

receiver_filter:
  passband_edge_hz: 13500000.0
  stopband_edge_hz: 14700000.0
  num_taps: 129
  window: hamming

experiments:
  subcarrier_spacing_candidates_hz:
    - 15000.0
    - 30000.0
    - 60000.0
    - 120000.0
  normalized_cfo_candidates:
    - 0.0
    - 0.01
    - 0.02
    - 0.05
    - 0.1
  snr_db:
    - 0.0
    - 5.0
    - 10.0
    - 15.0
    - 20.0
    - 25.0

team_confirmation:
  required_before_final_integration: false
  fields: []
