name: starlink-isl
channels:
  - conda-forge
dependencies:
  # Direct dependencies are pinned for repeatable Windows environments.
  - python=3.12.11
  - numpy=2.2.6
  - pandas=2.3.0
  - pyyaml=6.0.2
  - scipy=1.15.3
  - matplotlib=3.10.3
  - networkx=3.5
  - requests=2.32.4
  - pytest=8.4.1
  - pip=25.1.1
  - pip:
      - sgp4==2.25
      - -e .
